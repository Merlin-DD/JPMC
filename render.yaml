services:
  - type: web
    name: synth-pnl
    runtime: python
    plan: starter
    buildCommand: ./build.sh
    startCommand: gunicorn synth_pnl.wsgi:application
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ""
      - key: DB_PATH
        value: /var/data/book.sqlite3
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
